name: Advanced RAG CI

on:
  push:
    branches:
      - claude-refactor
    paths:
      - "advanced-rag/**"
      - ".github/workflows/advanced-rag-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "advanced-rag/**"
      - ".github/workflows/advanced-rag-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: advanced-rag
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: advanced-rag/pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q
